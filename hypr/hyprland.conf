# Dark mode

exec = gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3-dark" # for GTK3
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps
env = QT_QPA_PLATFORMTHEME,kvantum  # for Qt apps


input {
	kb_layout = us
	kb_variant = 
}

$mainMod =SUPER

# Programas principais
$terminal = kitty
$fileManager = dolphin

# Atalhos de aplicativo
bind = $mainMod, T, exec, $terminal
bind = $mainMod, E, exec, $fileManager

# Gerenciamento de Janelas
bind = $mainMod, Escape, killactive,
bind = $mainMod, V, togglefloating,0
bind = $mainMod, M, exit,
bind = $mainMod, R, exec, ~/.config/waybar/scripts/launch.sh

exec-once = waybar
exec-once = dunst
exec-once = awww-daemon


exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent

# Forçar backend Wayland no Qt e GTK
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11,*
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1


# Monitor AOC (144Hz) - Posição inicial (0x0)
monitor = DP-1, 1920x1080@144, 0x0, 1

# Monitor Acer (60Hz) - Posicionado à direita do principal (1920x0)
monitor = HDMI-A-1, 1920x1080@60, 1920x0, 1                                                                                                                                                                                                                  
    
# Mudar para a área de trabalho (workspace) de 1 a 10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover a janela ativa para a área de trabalho
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5 
                                                                                                                                                                                                                                                                                                                                                                                                                                                              
# Mover o foco entre janelas com SUPER + setas
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Alternar modo tela cheia
bind = $mainMod, F, fullscreen, 1                                                                                                                                                                                                                                                               
                                                                                                                                                                                                                       
                                                                                                                                                                                                                                                                        
bind = $mainMod, P, exec, pkill rofi || .config/rofi/launchers/type-1/launcher.sh

source = /home/Iroha/.config/hypr/colors.conf

general {
    gaps_in = 7
    gaps_out = 17

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = $secondary
    col.inactive_border = $outline_variant

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}
decoration {
    rounding = 8
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
	}
}

windowrule {
    # Ignore maximize requests from all apps
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = true
}
